[package]
name = "oxarr-core"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[dependencies]
oxarr-types = { path = "../types" }
async-trait = "0.1"
anyhow = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "chrono"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
extism = "1.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
