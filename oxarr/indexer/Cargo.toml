[package]
name = "oxarr-indexer"
version = "0.1.0"
edition = "2021"
license-file.workspace = true

[dependencies]
oxarr-types = { path = "../types" }
async-trait = "0.1"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tokio = { version = "1.0", features = ["macros", "rt"] }
