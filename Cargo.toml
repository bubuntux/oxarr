[workspace]
resolver = "3"
members = [
    "oxarr/core",
    "oxarr/types",
    "oxarr/migration",
    "oxarr/parser",
    "oxarr/probe",
    "oxarr/server",
    "plugins/tmdb",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
oxarr-types = { path = "oxarr/types" }
oxarr-migration = { path = "oxarr/migration" }

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sea-orm = { version = "2.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.0"
uuid = { version = "1.0", default-features = false, features = ["serde", "std"] }
